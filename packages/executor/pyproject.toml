[project]
name = "mnemobun-executor"
version = "0.2.0"
description = "mnemobun executors: how the library borrows intelligence from outside itself"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["mnemobun-core", "mnemobun-mcp"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mnemobun"]
