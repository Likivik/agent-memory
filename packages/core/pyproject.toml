[project]
name = "mnemobun-core"
version = "0.2.0"
description = "mnemobun core: truth store, index projection, recall, manage"
requires-python = ">=3.12"
license = "MIT"
dependencies = []

[project.optional-dependencies]
vector = ["fastembed>=0.7,<1"]
cjk = ["jieba>=0.42"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mnemobun"]
