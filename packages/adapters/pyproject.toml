[project]
name = "mnemobun-adapters"
version = "0.2.0"
description = "mnemobun host adapters: hooks, setup, injection"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["mnemobun-core"]

[project.scripts]
mem-hook = "mnemobun.adapters.hook_entry:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mnemobun"]
