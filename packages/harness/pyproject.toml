[project]
name = "mnemobun-harness"
version = "0.2.0"
description = "mnemobun experiment harness: replay driver, metrics, report"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["mnemobun-core", "mnemobun-cli", "mnemobun-executor"]

[project.scripts]
mem-exp = "mnemobun.harness.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mnemobun"]
