[project]
name = "mnemobun-mcp"
version = "0.2.0"
description = "mnemobun MCP adapter"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["mnemobun-core"]

[project.scripts]
mem-mcp = "mnemobun.mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mnemobun"]
