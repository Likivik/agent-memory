[project]
name = "mnemobun-cli"
version = "0.2.0"
description = "mnemobun CLI adapter"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["mnemobun-core", "mnemobun-executor", "mnemobun-adapters"]

[project.scripts]
mnemobun = "mnemobun.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mnemobun"]
