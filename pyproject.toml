[project]
name = "mnemobun-workspace"
version = "0.1.0"
description = "Agent-agnostic, local-first long-term memory runtime"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "mnemobun-core",
    "mnemobun-cli",
    "mnemobun-adapters",
]

[project.optional-dependencies]
mcp = ["mnemobun-mcp"]
executor = ["mnemobun-executor"]
vector = ["mnemobun-core[vector]"]
cjk = ["mnemobun-core[cjk]"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
mnemobun-core = { workspace = true }
mnemobun-cli = { workspace = true }
mnemobun-mcp = { workspace = true }
mnemobun-adapters = { workspace = true }
mnemobun-executor = { workspace = true }

[tool.ruff.lint.per-file-ignores]
# Host dialect modules re-export the shared driver surface via star imports.
"packages/executor/src/mnemobun/executor/agents/*" = ["F403", "F405"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "stress: performance budgets, run on release",
    "redteam: adversarial cases, gate before release",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
namespace_packages = true
explicit_package_bases = true
files = ["packages"]
ignore_missing_imports = true
