name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    # The system tests install fake driver binaries as shebang scripts and exec
    # them from PATH: POSIX-only by construction, so no Windows leg.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-packages
      - name: Lint
        run: uv run ruff check .
      - name: Types
        run: uv run mypy
      - name: Tests
        run: uv run pytest -q --cov=mnemobun --cov-report=term-missing --cov-fail-under=85
